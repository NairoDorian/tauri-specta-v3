[package]
name = "tauri-specta-default-tests"
version = "0.0.0"
edition = "2024"
publish = false

# A downstream consumer with no Tauri dependency of its own. Its committed
# lockfile must resolve stable Tauri v2 through `tauri-specta`'s `v2` feature
# (a default upstream, opt-in in this Tauri 3 fork, so it is named here);
# `tests/assert_tauri_version.py` enforces that in CI.
[workspace]

[dependencies]
tauri-specta = { path = "../..", features = ["v2", "derive", "typescript"] }
tauri-specta-query = { path = "../../crates/tauri-specta-query", features = ["v2"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"
serde = { version = "1", features = ["derive"] }
